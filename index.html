    <style>
        /* 开关基础样式 */
        .toggle-checkbox:checked + .toggle-label { background-color: #2563eb; }
        .toggle-checkbox:checked + .toggle-label .toggle-dot { transform: translateX(100%); }
        .toggle-dot { transition: transform 0.2s ease-in-out; }
        .toggle-label { transition: background-color 0.2s ease-in-out; }
        body.dark .hover\:bg-red-50:hover { background-color: rgba(239, 68, 68, 0.1); }
        /* --- 补丁：暗黑模式全局变量 --- */
        :root { --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --border: #f1f5f9; }
        body.dark { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --border: #334155; }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg); /* 改用变量 */
            color: var(--text); /* 改用变量 */
            overflow-x: auto; 
            width: 100%; 
            transition: background 0.3s ease; /* 补丁：平滑切换 */
            -webkit-tap-highlight-color: transparent; 
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* 补丁：适配暗黑模式的卡片样式 */
        .product-card { display: flex; flex-direction: column; height: 100%; position: relative; transition: all 0.3s ease; border-radius: 1.5rem; border: 1px solid var(--border); background: var(--card); }
        
        /* 补丁：骨架屏加载动画 & 悬浮放大镜 */
        .image-container { 
            position: relative; width: 100%; padding-top: 100%; 
            background: linear-gradient(90deg, #f1f5f9 25%, #f8fafc 50%, #f1f5f9 75%);
            background-size: 200% 100%; animation: shimmer 1.5s infinite;
            border-radius: 1.5rem 1.5rem 0 0; overflow: hidden; cursor: zoom-in; 
        }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        .image-container img { position: absolute; top: 0; left: 0; bottom: 0; right: 0; margin: auto; max-width: 90%; max-height: 90%; object-fit: contain; z-index: 1; transition: transform 0.4s ease; }
        
        /* 补丁：PC端悬浮放大效果 */
        @media (min-width: 1024px) {
            .image-container:hover img { transform: scale(1.1); }
        }

        /* 补丁：红心收藏按钮样式 */

            position: absolute; top: 12px; left: 12px; z-index: 20; width: 36px; height: 36px; border-radius: 50%; 
            background: rgba(255,255,255,0.9); display: flex; align-items: center; justify-content: center; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);

        function clearCart() {
    // 1. 弹出确认框防止误删
    if (!confirm("¿Estás seguro de que deseas vaciar todo el pedido?")) return;
    
    vibrate(); // 震动反馈
    
    // 2. 清空当前数据源的对象
    cart = {};
    productNotes = {};
    
    // 3. 同步到本地存储 (LocalStorage)
    saveToLocal();
    
    // 4. 刷新界面
    render();             // 刷新主页列表（按钮变回加号或数量清零）
    refreshCartModal();   // 刷新购物车弹窗显示
    updateCartBar();      // 更新底部的蓝色总数条（会自动隐藏，因为数量为0）
    
    // 5. 如果购物车空了，自动关闭弹窗（可选）
    setTimeout(() => {
        closeAllModals();
    }, 500);
}
        let products = [], cart = {}, productNotes = {}, favorites = {}, sources = [], currentSourceKey = null;
       
        let activeContactIndex = 0;
        let isFavoriteMode = false; /* 补丁：收藏模式开关 */
        const CONTACTS = [{name: "Axin", phone: "56926108498"}, {name: "Ivan", phone: "59168043587"}];
        let activeFilters = { keyword: "", MARCA: null, CATEGORIA: null, TIPO: null, priceRange: null };
        let announcementTimer; 

        /* 补丁：功能逻辑 */
       // --- 1. 震动控制逻辑 ---
let isVibrationEnabled = localStorage.getItem('vibration_enabled') !== 'false';

function vibrate() {
    if (isVibrationEnabled && navigator.vibrate) {
        navigator.vibrate(15);
    }
}

function toggleVibration() {
    isVibrationEnabled = document.getElementById('vibration-toggle').checked;
    localStorage.setItem('vibration_enabled', isVibrationEnabled);
    if (isVibrationEnabled) vibrate();
}

// --- 2. 升级版暗黑模式切换 ---
function toggleDarkMode() {
    document.body.classList.toggle('dark');
    const isDark = document.body.classList.contains('dark');
    localStorage.setItem('starphone_dark', isDark);
    
    // 同步侧边栏的开关状态
    const checkbox = document.getElementById('dark-mode-toggle');
    if(checkbox) checkbox.checked = isDark;
    
    // 同步顶部导航栏图标
    const icon = document.getElementById('dark-icon');
    if(icon) icon.innerText = isDark ? '☀️' : '🌙';
    
    vibrate();
}
        function handleImgError(img) { img.onerror = null; img.src = "https://via.placeholder.com/300?text=Starphone+Premium"; }
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeAllModals();
            if (e.key === '/' && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); document.getElementById('search').focus(); }
        });

        async function init() {
             // 补丁：版本检测，如果是老用户则清理一次旧缓存，确保新版收藏 ID 生效
            if (!localStorage.getItem('app_version_v2')) {
                localStorage.clear(); 
                localStorage.setItem('app_version_v2', '1.0');
                // 清理完后需要重新加载页面设置，防止变量为空
                location.reload(); 
                return;

        if (p) {
            const sub = (parseFloat(p['Precio ( USD )']) || 0) * cart[id];
            grandTotal += sub;
            
            // 关键修正：直接读取 products.json 里的内容
            const tag = String(p['qcy-yf'] || '').toUpperCase().trim();

            // 修正匹配逻辑：根据你 json 里的实际文字来判断
            if (tag === 'STARPHONE' || tag.includes('YF')) {
                groups['STARPHONE'].push(itemData);
            } else if (tag === 'QUE VIVO' || tag.includes('QCY')) {
                groups['QUE VIVO'].push(itemData);
            } else {
                groups['OTROS'].push(itemData);
            }
        }
    }

    let m = ""; 
    let globalItemCount = 1;
    const groupOrder = ['STARPHONE', 'QUE VIVO', 'OTROS'];

            m += `⭐ *NUEVO PEDIDO ${name}*\n`;
            m += `--------------------------\n`;

            items.forEach(item => {
                m += `*item ${globalItemCount}.* *${item.p.PRODUCTO}*\n`; 
                if(item.note) m += `_Nota: ${item.note}_\n`;
                m += `Cant: ${item.qty} | Sub: *$${item.sub.toFixed(2)}*\n`; 
                globalItemCount++;
            });

            m += `--------------------------\n\n`; 
        }
    });

    m += `💰 *TOTAL PEDIDO: $${grandTotal.toFixed(2)}*`;

                    return mK && mM && mC && mT && matchPrice && p[type] === item;
                });
                let btnClass = isActive ? "bg-blue-600 text-white border-blue-600 shadow-lg scale-[1.02]" : (hasResults ? "bg-white text-slate-600 border-slate-100 dark:bg-slate-800 dark:text-slate-300 hover:border-slate-300" : "bg-slate-50 text-slate-300 border-slate-50 opacity-50 cursor-not-allowed");
                return `<button onclick="${hasResults || isActive ? `setFilter('${type}', '${item}')` : ''}" class="w-full flex justify-between items-center px-4 py-3 rounded-xl border text-[11px] font-bold transition-all ${btnClass}"><span>${item}</span>${isActive ? '<span class="ml-2 text-[14px]">✕</span>' : ''}</button>`;
            }).join(''); 

            const priceRanges = [
                { label: 'Bajo $50', value: 'under50' },
                { label: '$50 - $200', value: '50to200' },
                { label: 'Sobre $200', value: 'over200' }
            ];
            const priceBtns = priceRanges.map(item => {
                const isActive = activeFilters.priceRange === item.value;
                let btnClass = isActive ? "bg-blue-600 text-white border-blue-600 shadow-lg scale-[1.02]" : "bg-white text-slate-600 border-slate-100 dark:bg-slate-800 dark:text-slate-300 hover:border-slate-300";
                return `<button onclick="setFilter('priceRange', '${item.value}')" class="w-full flex justify-between items-center px-4 py-3 rounded-xl border text-[11px] font-bold transition-all ${btnClass}"><span>${item.label}</span>${isActive ? '<span class="ml-2 text-[14px]">✕</span>' : ''}</button>`;
            }).join('');

            // --- 已经去掉了 MENU 标题栏，html 从空字符串开始 ---
            let html = ""; 
            
            // 直接渲染价格、分类等
            html += `<div><h3 class="text-emerald-600 font-black text-[10px] uppercase tracking-widest mb-3 flex items-center gap-2"><span>Precios</span><div class="h-[1px] flex-1 bg-emerald-100 dark:bg-emerald-900/20"></div></h3><div class="grid grid-cols-1 gap-1">${priceBtns}</div></div>`;
            if(categorias.length > 0) html += `<div class="mt-6"><h3 class="text-blue-600 font-black text-[10px] uppercase tracking-widest mb-3 flex items-center gap-2"><span>Categorías</span><div class="h-[1px] flex-1 bg-blue-100 dark:bg-blue-900/20"></div></h3><div class="grid grid-cols-1 gap-1">${createBtn(categorias, 'CATEGORIA')}</div></div>`;
            if(marcas.length > 0) html += `<div class="mt-6"><h3 class="text-indigo-600 font-black text-[10px] uppercase tracking-widest mb-3 flex items-center gap-2"><span>Marcas</span><div class="h-[1px] flex-1 bg-indigo-100 dark:bg-indigo-900/20"></div></h3><div class="grid grid-cols-1 gap-1">${createBtn(marcas, 'MARCA')}</div></div>`;
            if(tipos.length > 0) html += `<div class="mt-6"><h3 class="text-slate-500 font-black text-[10px] uppercase tracking-widest mb-3 flex items-center gap-2"><span>Otros</span><div class="h-[1px] flex-1 bg-slate-100 dark:bg-slate-800/20"></div></h3><div class="grid grid-cols-1 gap-1">${createBtn(tipos, 'TIPO')}</div></div>`;
            
            document.getElementById('filter-content').innerHTML = html || "<p class='text-slate-400 text-xs font-bold uppercase'>No hay filtros disponibles</p>";
        }
        init(); // 网页初始化，这行保留

        // --- 精准背景锁定逻辑：只针对结算清单 ---
        function handleScrollLock() {
            const cartModal = document.getElementById('cart-modal');
            // 判断结算面板是否包含 'active' 类 (即是否打开了清单)
            if (cartModal && cartModal.classList.contains('active')) {
                document.body.style.overflow = 'hidden'; // 打开时禁止背景滚动
            } else {
                document.body.style.overflow = ''; // 其他情况(如筛选时)允许背景滚动
            }
        }

        // 绑定监听
        const cartTarget = document.getElementById('cart-modal');
        if (cartTarget) {
            const cartObserver = new MutationObserver(handleScrollLock);
            cartObserver.observe(cartTarget, { 
                attributes: true, 
                attributeFilter: ['class'] 
            });
        }
    </script>
</body>
</html>
